@if (variant() === 'card') {
  <div
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
    role="status"
    aria-live="polite"
    aria-busy="true"
  >
    @for (item of items(); track item) {
      <div class="rounded-3xl bg-white dark:bg-[#13121d] border border-slate-200 dark:border-white/10 overflow-hidden flex flex-col justify-between">
        <!-- Cover Image Skeleton with Overlay Placeholders -->
        <div class="relative h-52 w-full bg-slate-200/80 dark:bg-white/[0.06] animate-pulse">
          <div class="absolute top-3.5 left-3.5 right-3.5 flex items-center justify-between">
            <div class="h-6 w-24 rounded-full bg-slate-300/80 dark:bg-white/10"></div>
            <div class="w-8 h-8 rounded-full bg-slate-300/80 dark:bg-white/10"></div>
          </div>
          <div class="absolute bottom-3.5 left-4">
            <div class="h-3.5 w-28 rounded-md bg-slate-300/80 dark:bg-white/10"></div>
          </div>
        </div>

        <!-- Card Body Skeleton -->
        <div class="p-5 space-y-4 flex-1 flex flex-col justify-between animate-pulse">
          <div class="space-y-2.5">
            <!-- Title & Price Row -->
            <div class="flex items-start justify-between gap-3">
              <div class="h-5 w-2/3 rounded-lg bg-slate-200 dark:bg-white/10"></div>
              <div class="h-5 w-16 rounded-lg bg-slate-200 dark:bg-white/10 shrink-0"></div>
            </div>
            <!-- Host / Venue Subtitle -->
            <div class="h-3.5 w-1/2 rounded-md bg-slate-200/70 dark:bg-white/[0.06]"></div>
          </div>

          <!-- Quorum Progress Box Skeleton -->
          <div class="p-3.5 rounded-2xl bg-slate-100/80 dark:bg-[#0b0a10] border border-slate-200/60 dark:border-white/5 space-y-2.5">
            <div class="flex items-center justify-between">
              <div class="h-3 w-36 rounded bg-slate-200 dark:bg-white/10"></div>
              <div class="h-3 w-14 rounded bg-slate-200/70 dark:bg-white/[0.06]"></div>
            </div>
            <div class="w-full h-1.5 rounded-full bg-slate-200 dark:bg-white/10 overflow-hidden">
              <div class="h-full w-3/5 rounded-full bg-slate-300 dark:bg-white/20"></div>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
} @else {
  <div
    class="rounded-3xl bg-white dark:bg-[#13121d] border border-slate-200 dark:border-white/10 divide-y divide-slate-200 dark:divide-white/10"
    role="status"
    aria-live="polite"
    aria-busy="true"
  >
    @for (item of items(); track item) {
      <div class="p-5 flex items-center justify-between gap-4 animate-pulse">
        <div class="flex items-center gap-3.5 flex-1">
          <div class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-white/10 shrink-0"></div>
          <div class="space-y-2 flex-1 max-w-xs">
            <div class="h-4 w-3/4 rounded bg-slate-200 dark:bg-white/10"></div>
            <div class="h-3 w-1/2 rounded bg-slate-200/70 dark:bg-white/[0.06]"></div>
          </div>
        </div>
        <div class="h-5 w-20 rounded-lg bg-slate-200 dark:bg-white/10 shrink-0"></div>
      </div>
    }
  </div>
}
