<div class="space-y-6">
  <div>
    <p class="ui-eyebrow">{{ 'auth.eyebrow' | translate }}</p>
    <h1 class="ui-title">{{ 'auth.login.title' | translate }}</h1>
    <p class="ui-description">{{ 'auth.login.subtitle' | translate }}</p>
  </div>
  <app-auth-tabs />
  @if (errorKey()) {
    <app-alert tone="error">{{ errorKey()! | translate }}</app-alert>
  }
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5" novalidate>
    <app-field
      controlId="email"
      [label]="'auth.email' | translate"
      [error]="
        form.controls.email.touched && form.controls.email.invalid
          ? ((form.controls.email.hasError('required') ? 'auth.required' : 'auth.invalidEmail')
            | translate)
          : ''
      "
    >
      <input
        appInput
        type="email"
        formControlName="email"
        autocomplete="email"
        required
        [placeholder]="'auth.emailPlaceholder' | translate"
      />
    </app-field>
    <app-field
      controlId="password"
      [label]="'auth.password' | translate"
      [error]="
        form.controls.password.touched && form.controls.password.invalid
          ? ('auth.required' | translate)
          : ''
      "
    >
      <div class="relative">
        <input
          appInput
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          required
          class="pr-24"
          style="padding-right: 6rem"
          [placeholder]="'auth.passwordPlaceholder' | translate"
        />
        <button
          appButton
          variant="ghost"
          size="sm"
          class="absolute right-1 top-0.5"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-pressed]="showPassword()"
          [attr.aria-label]="(showPassword() ? 'auth.hide' : 'auth.show') | translate"
        >
          <app-icon [name]="showPassword() ? 'eye-slash' : 'eye'" sizeClass="w-4 h-4" />{{
            (showPassword() ? 'auth.hide' : 'auth.show') | translate
          }}
        </button>
      </div>
    </app-field>
    <label class="flex items-center gap-2 text-sm ui-muted cursor-pointer min-h-11"
      ><input type="checkbox" formControlName="remember" class="w-4 h-4 accent-violet-600" />{{
        'auth.login.remember' | translate
      }}</label
    >
    <button appButton type="submit" [busy]="loading()" class="w-full">
      {{ (loading() ? 'auth.login.loading' : 'auth.login.submit') | translate
      }}<app-icon name="arrow-right" sizeClass="w-4 h-4" />
    </button>
    <p class="ui-muted text-xs text-center leading-relaxed">{{ 'auth.terms' | translate }}</p>
  </form>
</div>
