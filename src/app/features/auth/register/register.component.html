<div class="p-7 sm:p-9 rounded-2xl bg-[var(--ui-surface)] border border-[var(--ui-border)] shadow-sm space-y-6">
  <div>
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-[var(--ui-accent)] mb-1.5">
      {{ 'auth.eyebrow' | translate }}
    </p>
    <h1 class="font-editorial text-3xl sm:text-4xl font-normal tracking-tight text-[var(--ui-text)]">
      {{ 'auth.register.title' | translate }}
    </h1>
    <p class="text-sm text-[var(--ui-muted)] mt-1.5 leading-relaxed">
      {{ 'auth.register.subtitle' | translate }}
    </p>
  </div>

  <app-auth-tabs />

  @if (errorMessage()) {
    <app-alert tone="error">{{ errorMessage() }}</app-alert>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4" novalidate>
    <app-field
      controlId="fullName"
      [label]="'auth.register.fullName' | translate"
      [error]="
        form.controls.fullName.touched && form.controls.fullName.invalid
          ? ('auth.required' | translate)
          : ''
      "
    >
      <input
        appInput
        formControlName="fullName"
        autocomplete="name"
        required
        class="rounded-xl"
        [placeholder]="'auth.register.fullNamePlaceholder' | translate"
      />
    </app-field>

    <app-field
      controlId="email"
      [label]="'auth.email' | translate"
      [error]="
        form.controls.email.touched && form.controls.email.invalid
          ? ((form.controls.email.hasError('required') ? 'auth.required' : 'auth.invalidEmail')
            | translate)
          : ''
      "
    >
      <input
        appInput
        type="email"
        formControlName="email"
        autocomplete="email"
        required
        class="rounded-xl"
        [placeholder]="'auth.emailPlaceholder' | translate"
      />
    </app-field>

    <app-field
      controlId="password"
      [label]="'auth.password' | translate"
      [error]="
        form.controls.password.touched && form.controls.password.invalid
          ? ('auth.register.minPassword' | translate)
          : ''
      "
    >
      <div class="relative">
        <input
          appInput
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="new-password"
          required
          minlength="8"
          class="pr-24 rounded-xl"
          style="padding-right: 6rem"
          [placeholder]="'auth.passwordPlaceholder' | translate"
        />
        <button
          appButton
          variant="ghost"
          size="sm"
          class="absolute right-1 top-0.5"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-pressed]="showPassword()"
          [attr.aria-label]="(showPassword() ? 'auth.hide' : 'auth.show') | translate"
        >
          <app-icon [name]="showPassword() ? 'eye-slash' : 'eye'" sizeClass="w-4 h-4" />{{
            (showPassword() ? 'auth.hide' : 'auth.show') | translate
          }}
        </button>
      </div>
    </app-field>

    <fieldset>
      <legend class="ui-label mb-3 text-xs uppercase tracking-wider text-[var(--ui-muted)] font-semibold">
        {{ 'auth.register.roleQuestion' | translate }}
      </legend>
      <div class="grid sm:grid-cols-2 gap-3">
        @for (option of roleOptions; track option.value) {
          <button
            appButton
            variant="secondary"
            class="ui-choice rounded-xl"
            (click)="role.set(option.value)"
            [attr.aria-pressed]="role() === option.value"
          >
            <span class="flex items-center justify-between gap-2"
              ><span class="text-sm font-semibold">{{ option.labelKey | translate }}</span>
              @if (role() === option.value) {
                <app-icon name="check-circle" sizeClass="w-5 h-5 text-[var(--ui-accent)]" />
              }
            </span>
            <span class="text-xs text-[var(--ui-muted)] font-normal leading-relaxed">{{
              option.descKey | translate
            }}</span>
          </button>
        }
      </div>
    </fieldset>

    <button
      appButton
      type="submit"
      [busy]="loading()"
      class="w-full !bg-[var(--ui-accent)] !border-[var(--ui-accent)] hover:!bg-[var(--ui-accent-hover)] text-white rounded-xl py-3 text-sm font-semibold tracking-wide transition-colors shadow-xs"
    >
      {{ (loading() ? 'auth.register.loading' : 'auth.register.submit') | translate }}
      <app-icon name="arrow-right" sizeClass="w-4 h-4" />
    </button>

    <p class="text-xs text-center text-[var(--ui-muted)] leading-relaxed">
      {{ 'auth.terms' | translate }}
    </p>
  </form>
</div>
