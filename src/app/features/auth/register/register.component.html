<div class="space-y-5">
  <div>
    <p class="ui-eyebrow">{{ 'auth.eyebrow' | translate }}</p>
    <h1 class="ui-title">{{ 'auth.register.title' | translate }}</h1>
    <p class="ui-description">{{ 'auth.register.subtitle' | translate }}</p>
  </div>
  <app-auth-tabs />
  @if (errorMessage()) {
    <app-alert tone="error">{{ errorMessage() }}</app-alert>
  }
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4" novalidate>
    <app-field
      controlId="fullName"
      [label]="'auth.register.fullName' | translate"
      [error]="
        form.controls.fullName.touched && form.controls.fullName.invalid
          ? ('auth.required' | translate)
          : ''
      "
    >
      <input
        appInput
        formControlName="fullName"
        autocomplete="name"
        required
        [placeholder]="'auth.register.fullNamePlaceholder' | translate"
      />
    </app-field>
    <app-field
      controlId="email"
      [label]="'auth.email' | translate"
      [error]="
        form.controls.email.touched && form.controls.email.invalid
          ? ((form.controls.email.hasError('required') ? 'auth.required' : 'auth.invalidEmail')
            | translate)
          : ''
      "
    >
      <input
        appInput
        type="email"
        formControlName="email"
        autocomplete="email"
        required
        [placeholder]="'auth.emailPlaceholder' | translate"
      />
    </app-field>
    <app-field
      controlId="password"
      [label]="'auth.password' | translate"
      [error]="
        form.controls.password.touched && form.controls.password.invalid
          ? ('auth.register.minPassword' | translate)
          : ''
      "
    >
      <div class="relative">
        <input
          appInput
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="new-password"
          required
          minlength="8"
          class="pr-24"
          style="padding-right: 6rem"
          [placeholder]="'auth.passwordPlaceholder' | translate"
        />
        <button
          appButton
          variant="ghost"
          size="sm"
          class="absolute right-1 top-0.5"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-pressed]="showPassword()"
          [attr.aria-label]="(showPassword() ? 'auth.hide' : 'auth.show') | translate"
        >
          <app-icon [name]="showPassword() ? 'eye-slash' : 'eye'" sizeClass="w-4 h-4" />{{
            (showPassword() ? 'auth.hide' : 'auth.show') | translate
          }}
        </button>
      </div>
    </app-field>
    <fieldset>
      <legend class="ui-label mb-3">{{ 'auth.register.roleQuestion' | translate }}</legend>
      <div class="grid sm:grid-cols-2 gap-3">
        @for (option of roleOptions; track option.value) {
          <button
            appButton
            variant="secondary"
            class="ui-choice"
            (click)="role.set(option.value)"
            [attr.aria-pressed]="role() === option.value"
          >
            <span class="flex items-center justify-between gap-2"
              ><span class="text-sm font-semibold">{{ option.labelKey | translate }}</span>
              @if (role() === option.value) {
                <app-icon name="check-circle" sizeClass="w-5 h-5" />
              }
            </span>
            <span class="text-xs ui-muted font-normal leading-relaxed">{{
              option.descKey | translate
            }}</span>
          </button>
        }
      </div>
    </fieldset>
    <button appButton type="submit" [busy]="loading()" class="w-full">
      {{ (loading() ? 'auth.register.loading' : 'auth.register.submit') | translate
      }}<app-icon name="arrow-right" sizeClass="w-4 h-4" />
    </button>
    <p class="ui-muted text-xs text-center leading-relaxed">{{ 'auth.terms' | translate }}</p>
  </form>
</div>
