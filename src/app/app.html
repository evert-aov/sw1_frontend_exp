<div class="min-h-dvh bg-[#f6f5fa] dark:bg-[#0b0a10] text-slate-900 dark:text-slate-100 transition-colors duration-200 flex flex-col font-sans">
  @if (isAuthPage()) {
    <!-- Login y registro: pantalla completa sin scroll -->
    <main class="h-dvh w-full overflow-hidden">
      <router-outlet />
    </main>
  } @else {
    <app-navbar />

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10">
      <router-outlet />
    </main>

    <app-footer />
  }
</div>
