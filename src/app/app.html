<div
  class="h-dvh max-h-dvh w-full overflow-hidden bg-[var(--ui-surface)] text-[var(--ui-text)] transition-colors duration-200 flex flex-col font-sans"
>
  <a class="ui-skip-link" href="#main-content">{{ 'ui.skip' | translate }}</a>
  @if (isStandalonePage()) {
    <!-- Pantalla completa sin appbar fijo (auth, home) -->
    <main id="main-content" tabindex="-1" class="h-dvh w-full overflow-y-auto">
      <router-outlet />
    </main>
  } @else {
    <!-- Appbar fijo en la parte superior -->
    <app-navbar class="shrink-0 z-50" />

    <!-- Contenedor con scroll independiente para el resto de la página -->
    <div class="flex-1 overflow-y-auto overflow-x-hidden flex flex-col scroll-smooth">
      <main
        id="main-content"
        tabindex="-1"
        class="flex-1 w-full mx-auto px-4 sm:px-6 lg:px-8"
        [class]="isWidePage() ? 'max-w-[1920px] py-3 sm:py-5' : 'max-w-7xl py-6 sm:py-10'"
      >
        <router-outlet />
      </main>

      <app-footer class="shrink-0" />
    </div>
  }

  <!-- Notificaciones en primer plano (estilo editorial) -->
  @if (notificationToasts().length > 0) {
    <div
      class="fixed top-4 right-4 z-[120] flex flex-col gap-3 w-[min(calc(100vw-2rem),24rem)] pointer-events-none"
      aria-live="polite"
    >
      @for (toast of notificationToasts(); track toast.id) {
        <div
          class="pointer-events-auto rounded-2xl border border-[var(--ui-border)] bg-[var(--ui-surface)] text-[var(--ui-text)] shadow-xl p-4 flex items-start gap-3"
        >
          <span
            class="w-2.5 h-2.5 mt-1.5 rounded-full bg-[var(--ui-accent)] shrink-0"
            aria-hidden="true"
          ></span>
          <button
            type="button"
            class="flex-1 min-w-0 text-left cursor-pointer"
            (click)="openNotificationToast(toast.id, toast.url)"
          >
            <p class="font-editorial text-sm font-semibold text-[var(--ui-text)] leading-snug">
              {{ toast.title }}
            </p>
            <p class="mt-1 text-xs text-[var(--ui-muted)] leading-relaxed">
              {{ toast.body }}
            </p>
          </button>
          <button
            type="button"
            class="text-xs text-[var(--ui-muted)] hover:text-[var(--ui-text)] px-1.5 py-0.5 cursor-pointer"
            (click)="dismissNotificationToast(toast.id)"
            aria-label="Cerrar notificación"
          >
            ✕
          </button>
        </div>
      }
    </div>
  }

  <!-- Manual Agéntico Interactivo (disponible en toda la plataforma) -->
  <app-user-guide-chatbot />
</div>
