<div
  class="h-dvh max-h-dvh w-full overflow-hidden bg-[var(--ui-surface)] text-[var(--ui-text)] transition-colors duration-200 flex flex-col font-sans"
>
  <a class="ui-skip-link" href="#main-content">{{ 'ui.skip' | translate }}</a>
  @if (isStandalonePage()) {
    <!-- Pantalla completa sin appbar fijo (auth, home) -->
    <main id="main-content" tabindex="-1" class="h-dvh w-full overflow-y-auto">
      <router-outlet />
    </main>
  } @else {
    <!-- Appbar fijo en la parte superior -->
    <app-navbar class="shrink-0 z-50" />

    <!-- Contenedor con scroll independiente para el resto de la página -->
    <div class="flex-1 overflow-y-auto overflow-x-hidden flex flex-col scroll-smooth">
      <main
        id="main-content"
        tabindex="-1"
        class="flex-1 w-full mx-auto px-4 sm:px-6 lg:px-8"
        [class]="isWidePage() ? 'max-w-[1920px] py-3 sm:py-5' : 'max-w-7xl py-6 sm:py-10'"
      >
        <router-outlet />
      </main>

      <app-footer class="shrink-0" />
    </div>
  }

  <!-- Manual Agéntico Interactivo (disponible en toda la plataforma) -->
  <app-user-guide-chatbot />
</div>
